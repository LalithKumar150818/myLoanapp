{% extends "base.html" %}
{% block content %}
<section class="hero">
  <h1>{{ t('hero_title') }}</h1>
  <p>{{ t('hero_sub') }}</p>
  <a class="btn white" href="{{ url_for('apply_loan') if user and not user.is_admin else url_for('register') }}">{{ t('apply_now') }}</a>
</section>
<section class="steps">
  <div class="step"><b>1</b><br>{{ t('step1') }}</div>
  <div class="step"><b>2</b><br>{{ t('step2') }}</div>
  <div class="step"><b>3</b><br>{{ t('step3') }}</div>
  <div class="step"><b>4</b><br>{{ t('step4') }}</div>
</section>
{% endblock %}
