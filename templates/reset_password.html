{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Reset Password</h2>
  <p>Choose a strong new password for your account.</p>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label for="reset-password">New Password</label>
    <div class="password-field">
      <input id="reset-password" type="password" name="password" minlength="8" required>
      <button type="button" class="password-toggle" aria-controls="reset-password" title="Show password" aria-label="Show password"></button>
    </div>
    <label for="reset-confirm-password">Confirm New Password</label>
    <div class="password-field">
      <input id="reset-confirm-password" type="password" name="confirm_password" minlength="8" required>
      <button type="button" class="password-toggle" aria-controls="reset-confirm-password" title="Show password" aria-label="Show password"></button>
    </div>
    <br><button class="btn full">Reset Password</button>
  </form>
</div>
{% endblock %}
