{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>{{ t('forgot_password') }}</h2>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label for="reset-email">{{ t('email') }}</label>
    <input id="reset-email" type="email" name="email" value="{{ form.get('email', '') }}" autocomplete="email" required>

    <label for="reset-phone">{{ t('mobile_number') }}</label>
    <input id="reset-phone" type="tel" name="phone" value="{{ form.get('phone', '') }}" autocomplete="tel" required>

    <label for="reset-password">{{ t('new_password') }}</label>
    <div class="password-field">
      <input id="reset-password" type="password" name="password" minlength="6" autocomplete="new-password" required>
      <button type="button" class="password-toggle" data-password-target="reset-password" aria-label="{{ t('show_password') }}" title="{{ t('show_password') }}"></button>
    </div>

    <label for="reset-confirm-password">{{ t('confirm_new_password') }}</label>
    <div class="password-field">
      <input id="reset-confirm-password" type="password" name="confirm_password" minlength="6" autocomplete="new-password" required>
      <button type="button" class="password-toggle" data-password-target="reset-confirm-password" aria-label="{{ t('show_password') }}" title="{{ t('show_password') }}"></button>
    </div>
    <br><button class="btn full" type="submit">{{ t('ok') }}</button>
  </form>
  <p><a href="{{ url_for('login') }}">← {{ t('back_to_login') }}</a></p>
</div>
{% endblock %}
