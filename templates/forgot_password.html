{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Forgot Password</h2>
  {% if step == "verify" %}
    <p>Enter the 6-digit verification code sent to your registered email.</p>
    <form method="post" action="{{ url_for('verify_password_reset') }}">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <label for="reset-code">Verification Code</label>
      <input id="reset-code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
      <br><button class="btn full">Verify Code</button>
    </form>
    <p><a href="{{ url_for('forgot_password') }}">Request another code</a></p>
  {% else %}
    <p>Enter your registered email address or mobile number.</p>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <label for="reset-identifier">Email Address / Mobile Number</label>
      <input id="reset-identifier" name="identifier" required>
      <br><button class="btn full">Send Verification Code</button>
    </form>
  {% endif %}
  <p><a href="{{ url_for('login') }}">Back to Login</a></p>
</div>
{% endblock %}
