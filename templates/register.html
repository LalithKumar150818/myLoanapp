{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>{{ t('register') }}</h2>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label>{{ t('full_name') }}</label><input name="name" value="{{ form.get('name','') }}" required>
    <label>{{ t('phone') }}</label><input name="phone" inputmode="numeric" maxlength="10" value="{{ form.get('phone','') }}" required>
    <label>{{ t('email') }}</label><input type="email" name="email" value="{{ form.get('email','') }}" required>
    <label>{{ t('password') }}</label><input type="password" name="password" minlength="8" required>
    <label>{{ t('confirm_password') }}</label><input type="password" name="confirm_password" minlength="8" required>
    <br><button class="btn full">{{ t('register') }}</button>
  </form>
  <p>{{ t('have_account') }} <a href="{{ url_for('login') }}">{{ t('login') }}</a></p>
</div>
{% endblock %}
