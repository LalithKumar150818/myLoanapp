{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>{{ t('register') }}</h2>
  <form method="post" id="register-form">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label for="name">{{ t('full_name') }}</label>
    <input id="name" name="name" class="{{ 'field-error' if field_errors.get('name') }}" value="{{ form.get('name','') }}" required>

    <label for="phone">{{ t('phone') }}</label>
    <div class="phone-input">
      <span class="country-code" aria-hidden="true">+91</span>
      <input id="phone" name="phone" type="tel" class="{{ 'field-error' if field_errors.get('phone') }}" inputmode="numeric" autocomplete="tel-national" pattern="[0-9]{10}" maxlength="10" placeholder="9876543210" value="{{ form.get('phone','') }}" required>
    </div>

    <label for="email">{{ t('email') }}</label>
    <input id="email" type="email" name="email" class="{{ 'field-error' if field_errors.get('email') }}" value="{{ form.get('email','') }}" required>
    <label for="password">{{ t('password') }}</label>
    <div class="password-field">
      <input id="password" type="password" name="password" class="{{ 'field-error' if field_errors.get('password') }}" minlength="8" required>
      <button type="button" class="password-toggle" data-password-target="password" aria-label="{{ t('show_password') }}" title="{{ t('show_password') }}">Show</button>
    </div>
    <label for="confirm_password">{{ t('confirm_password') }}</label>
    <input id="confirm_password" type="password" name="confirm_password" minlength="8" required>
    <br><button class="btn full">{{ t('register') }}</button>
  </form>
</div>
{% endblock %}
