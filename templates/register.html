{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>{{ t('register') }}</h2>
  <form method="post" id="register-form">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label for="name">{{ t('full_name') }}</label>
    <input id="name" name="name" class="{{ 'field-error' if field_errors.get('name') }}" value="{{ form.get('name','') }}" required>
    <label for="country-code">Country Code</label>
    <select id="country-code" name="country_code" required>
      <option value="+91">India (+91)</option>
      <option value="+1">United States / Canada (+1)</option>
      <option value="+44">United Kingdom (+44)</option>
    </select>
    <label for="phone">{{ t('phone') }}</label>
    <div class="otp-row">
      <input id="phone" name="phone" class="{{ 'field-error' if field_errors.get('phone') or field_errors.get('otp') }}" inputmode="tel" autocomplete="tel-national" value="{{ form.get('phone','') }}" required>
      <button class="btn small" id="send-otp" type="button">Get OTP</button>
    </div>
    <label for="otp">Mobile OTP</label>
    <div class="otp-row">
      <input id="otp" name="otp" class="{{ 'field-error' if field_errors.get('otp') }}" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="Enter 6-digit OTP">
      <button class="btn small secondary" id="verify-otp" type="button">Verify OTP</button>
    </div>
    <div id="otp-status" class="otp-status" role="status"></div>
    <div id="phone-error" class="field-message" aria-live="polite"></div>
    <div id="resend-status" class="resend-status" aria-live="polite"></div>
    <input id="firebase-id-token" name="firebase_id_token" type="hidden" value="">
    <div id="recaptcha-container"></div>
    <label for="email">{{ t('email') }}</label>
    <input id="email" type="email" name="email" class="{{ 'field-error' if field_errors.get('email') }}" value="{{ form.get('email','') }}" required>
    <label for="password">{{ t('password') }}</label><input id="password" type="password" name="password" class="{{ 'field-error' if field_errors.get('password') }}" minlength="8" required>
    <label for="confirm_password">{{ t('confirm_password') }}</label><input id="confirm_password" type="password" name="confirm_password" class="{{ 'field-error' if field_errors.get('confirm_password') }}" minlength="8" required>
    <br><button class="btn full">{{ t('register') }}</button>
  </form>
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBAZzhSdITPRLP1pkotzbModUADN0bD1DUw",
    authDomain: "loanmobileapp-4bc94.firebaseapp.com",
    projectId: "loanmobileapp-4bc94",
    storageBucket: "loanmobileapp-4bc94.firebasestorage.app",
    messagingSenderId: "899795498679",
    appId: "1:899795498679:web:51d481fe074c3d32daff32"
  };
  const firebaseApp = initializeApp(firebaseConfig);
  const auth = getAuth(firebaseApp);
  auth.useDeviceLanguage();

  (function () {
    const csrf = document.querySelector('#register-form input[name="_csrf"]').value;
    const phone = document.getElementById('phone');
    const otp = document.getElementById('otp');
    const status = document.getElementById('otp-status');
    const phoneError = document.getElementById('phone-error');
    const resendStatus = document.getElementById('resend-status');
    const sendButton = document.getElementById('send-otp');
    const countryCode = document.getElementById('country-code');
    let resendTimer = null;
    let confirmation = null;
    let recaptchaVerifier = null;
    function startCountdown(seconds) {
      clearInterval(resendTimer);
      let remaining = seconds;
      sendButton.disabled = remaining > 0;
      resendStatus.textContent = remaining > 0 ? `Resend available in ${remaining}s` : '';
      resendTimer = setInterval(function () {
        remaining -= 1;
        resendStatus.textContent = remaining > 0 ? `Resend available in ${remaining}s` : 'You can resend the OTP now.';
        if (remaining <= 0) {
          clearInterval(resendTimer);
          sendButton.disabled = false;
        }
      }, 1000);
    }
    function body(extra) { const data = new URLSearchParams(extra); data.set('_csrf', csrf); return data; }
    function e164Number() {
      const digits = phone.value.replace(/\D/g, '');
      const callingCode = countryCode.value.replace(/\D/g, '');
      if (!digits || !callingCode) return null;
      return '+' + callingCode + digits;
    }
    function firebaseError(error) {
      const messages = {
        'auth/invalid-phone-number': 'Invalid mobile number. Please enter a valid number.',
        'auth/missing-phone-number': 'Invalid mobile number. Please enter a valid number.',
        'auth/too-many-requests': 'Too many attempts. Please try again later.',
        'auth/captcha-check-failed': 'Security verification failed. Please try again.',
        'auth/quota-exceeded': 'SMS service quota exceeded. Please try again later.',
        'auth/code-expired': 'OTP expired. Please request a new OTP.',
        'auth/invalid-verification-code': 'Incorrect OTP. Please try again.',
        'auth/session-expired': 'OTP expired. Please request a new OTP.'
      };
      return messages[error.code] || 'Unable to send OTP. Please try again.';
    }
    function ensureRecaptcha() {
      if (!recaptchaVerifier) {
        recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'normal' });
      }
      return recaptchaVerifier;
    }
    async function request(url, extra, button) {
      button.disabled = true;
      try {
        const response = await fetch(url, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:body(extra)});
        const result = await response.json();
        status.textContent = result.message;
        status.className = 'otp-status ' + (result.ok ? 'success' : 'error');
        phoneError.textContent = result.field === 'phone' ? result.message : '';
        if (result.field === 'phone') phone.classList.add('field-error');
        else phone.classList.remove('field-error');
        if (result.resend_after) startCountdown(result.resend_after);
        if (result.retry_after) startCountdown(result.retry_after);
      } catch (_) { status.textContent = 'Unable to complete OTP request.'; status.className = 'otp-status error'; }
      if (button !== sendButton || resendStatus.textContent === '') button.disabled = false;
    }
    sendButton.addEventListener('click', async function () {
      const e164 = e164Number();
      if (!e164) {
        status.textContent = 'Invalid mobile number. Please enter a valid number.';
        status.className = 'otp-status error';
        phone.classList.add('field-error');
        return;
      }
      phone.classList.remove('field-error');
      phone.value = phone.value.replace(/\D/g, '');
      sendButton.disabled = true;
      try {
        const consent = await fetch('{{ url_for("send_mobile_otp") }}', {
          method: 'POST',
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          body: body({phone:e164, country_code:countryCode.value})
        });
        const consentResult = await consent.json();
        if (!consent.ok) throw consentResult;
        confirmation = await signInWithPhoneNumber(auth, e164, ensureRecaptcha());
        status.textContent = 'OTP sent successfully.';
        status.className = 'otp-status success';
        startCountdown(consentResult.resend_after || 60);
      } catch (error) {
        status.textContent = typeof error === 'object' && error.message ? error.message : firebaseError(error);
        status.className = 'otp-status error';
        sendButton.disabled = false;
      }
    });
    document.getElementById('verify-otp').addEventListener('click', async function () {
      if (!confirmation) {
        status.textContent = 'Please request an OTP first.';
        status.className = 'otp-status error';
        return;
      }
      if (!/^\d{6}$/.test(otp.value.trim())) {
        status.textContent = 'Enter the complete 6-digit OTP.';
        status.className = 'otp-status error';
        return;
      }
      const verifyButton = document.getElementById('verify-otp');
      verifyButton.disabled = true;
      try {
        const credential = await confirmation.confirm(otp.value.trim());
        const idToken = await credential.user.getIdToken(true);
        document.getElementById('firebase-id-token').value = idToken;
        const response = await fetch('{{ url_for("verify_mobile_otp") }}', {
          method: 'POST',
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          body: body({phone:e164Number(), country_code:countryCode.value, firebase_id_token:idToken})
        });
        const result = await response.json();
        status.textContent = result.ok ? 'Phone number verified successfully.' : result.message;
        status.className = 'otp-status ' + (result.ok ? 'success' : 'error');
      } catch (error) {
        status.textContent = firebaseError(error);
        status.className = 'otp-status error';
      } finally {
        verifyButton.disabled = false;
      }
    });
  })();
  </script>
  <p>{{ t('have_account') }} <a href="{{ url_for('login') }}">{{ t('login') }}</a></p>
</div>
{% endblock %}
