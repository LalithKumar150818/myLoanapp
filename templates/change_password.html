{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Change Password</h2>
  <p>Your temporary password has expired or must be changed. Please choose a new password.</p>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label for="change-password">New Password</label>
    <div class="password-field">
      <input id="change-password" type="password" name="password" minlength="8" required>
      <button type="button" class="password-toggle" aria-controls="change-password" title="Show password" aria-label="Show password"></button>
    </div>
    <label for="confirm-change-password">Confirm Password</label>
    <div class="password-field">
      <input id="confirm-change-password" type="password" name="confirm_password" minlength="8" required>
      <button type="button" class="password-toggle" aria-controls="confirm-change-password" title="Show password" aria-label="Show password"></button>
    </div>
    <br><button class="btn full">Change Password</button>
  </form>
</div>
{% endblock %}
